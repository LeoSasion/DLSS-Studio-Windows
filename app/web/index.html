<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark light"><title>DLSS Studio · 影像增强</title><link rel="icon" href="/assets/icons/star-four.svg"><link rel="stylesheet" href="/studio.css"><script>if(window.__DLSS_DESKTOP__)document.documentElement.classList.add('desktop-shell');try{document.documentElement.dataset.theme=localStorage.getItem('dlss-theme')||'dark';document.documentElement.dataset.glass=localStorage.getItem('dlss-glass')||'off'}catch{}</script><link rel="stylesheet" href="/dark-polish.css?v=edge-review-4"><link rel="stylesheet" href="/desktop-shell.css?v=maximize-1"><link rel="stylesheet" href="/workspace.css?v=header-engine-3"><link rel="stylesheet" href="/glass-mode.css?v=maximize-1"><link rel="stylesheet" href="/video-player.css?v=video-2"><link rel="stylesheet" href="/workbench.css?v=fixes-1"></head>
<body>
<div class="studio">
 <header class="topbar glass">
  <div class="brand-group"><a href="/" class="brand" aria-label="DLSS Studio 工作台"><img class="icon brand-icon" src="/assets/icons/star-four.svg" alt=""><span>DLSS Studio</span></a><div class="engine-status" role="status" aria-live="polite" tabindex="0" title="正在识别显卡与适配组件"><span class="engine-dot" aria-hidden="true"></span><span id="gpu-status">识别中…</span><span id="gpu-name" hidden></span></div></div>
  <nav class="mode-tabs" aria-label="处理类型"><button type="button" class="active" data-mode="image" aria-pressed="true">图片增强</button><button type="button" data-mode="video" aria-pressed="false">视频增强</button></nav>
  <div class="appearance-controls"><button type="button" id="glass-toggle" class="glass-button glass-toggle" aria-pressed="false" title="开启毛玻璃面板">玻璃</button><div class="theme-switch segmented" aria-label="外观主题"><button type="button" data-theme="light" aria-label="浅色主题" title="浅色主题"><img class="icon" src="/assets/icons/sun.svg" alt=""></button><button type="button" data-theme="dark" aria-label="深色主题" title="深色主题"><img class="icon" src="/assets/icons/moon.svg" alt=""></button></div></div>
 </header>
 <main class="workspace">
  <section class="canvas-panel glass" aria-label="素材与结果预览">
   <div class="canvas-toolbar">
    <div class="file-info"><img class="icon" src="/assets/icons/image.svg" alt=""><div><strong id="file-name">尚未选择图片</strong><span id="file-meta"></span></div></div>
    <div class="preview-actions"><button type="button" class="glass-button replace" id="upload-button"><img class="icon" src="/assets/icons/folder.svg" alt=""><span>更换素材</span></button>
    <div class="view-switch segmented" aria-label="预览模式"><button type="button" data-view="original" class="active" aria-pressed="true">原图</button><button type="button" data-view="result" disabled aria-pressed="false">增强后</button><button type="button" data-view="compare" disabled aria-pressed="false">对比</button></div></div>
    <div class="preview-tools"><div class="zoom-controls" role="group" aria-label="预览缩放"><button type="button" class="glass-button" id="zoom-fit">适应</button><button type="button" class="glass-button" id="zoom-native" title="按原像素查看">100%</button><button type="button" class="icon-button" id="zoom-out" aria-label="缩小预览"><img class="icon" src="/assets/icons/minus.svg" alt=""></button><output id="zoom-level" aria-live="polite">适应</output><button type="button" class="icon-button" id="zoom-in" aria-label="放大预览"><img class="icon" src="/assets/icons/plus.svg" alt=""></button><button type="button" class="glass-button" id="zoom-pan" aria-pressed="false" title="开启后拖动画面；也可按住空格拖动">平移</button></div><button type="button" class="glass-button" id="history-button">最近结果</button></div>
   </div>
   <div class="canvas" id="canvas">
    <div class="image-stage" id="image-stage" hidden><img id="source-image" alt="原图"><img id="result-image" alt="增强结果" hidden><div id="compare-line" hidden><span><img class="icon" src="/assets/icons/arrows-horizontal.svg" alt=""></span></div><input id="compare-slider" type="range" min="0" max="100" value="50" aria-label="拖动比较原图与结果" hidden><span class="image-label" id="source-label">原图</span><span class="image-label right" id="result-label" hidden>增强后</span></div>
    <div id="video-stage" class="video-stage" hidden>
     <div id="video-picture" class="video-picture"><div id="video-viewport" class="video-viewport">
      <video id="video-preview" playsinline preload="metadata"></video>
      <video id="video-result" playsinline preload="auto" muted hidden></video>
      <img id="video-frame-original" alt="当前视频帧" hidden><img id="video-frame-result" alt="当前帧增强结果" hidden>
      <div id="video-compare-line" class="video-compare-line" hidden><span><img class="icon" src="/assets/icons/arrows-horizontal.svg" alt=""></span></div>
      <input id="video-compare-slider" type="range" min="0" max="100" value="50" aria-label="拖动比较原视频与增强结果" hidden>
      <span id="video-source-label" class="image-label">原视频</span><span id="video-result-label" class="image-label right" hidden>增强后</span>
     </div><span id="video-loading" class="video-loading" role="status" hidden></span></div>
     <div class="video-transport" aria-label="视频播放控制">
      <button id="video-play" class="icon-button" type="button" aria-label="播放视频" title="播放视频" disabled><img class="icon" src="/assets/icons/play.svg" alt=""></button>
      <input id="video-timeline" type="range" min="0" max="0" step="0.001" value="0" aria-label="视频时间轴" disabled>
      <span id="video-time" class="video-time">00:00.000 / 00:00.000</span>
      <button id="video-mute" class="video-mute" type="button" aria-pressed="false" title="静音">静音</button>
      <button id="frame-test-button" class="glass-button frame-test" type="button" disabled title="自动暂停，只增强当前显示的这一帧">单帧测试</button>
     </div>
    </div>
    <div class="empty-state" id="empty-state"><img class="icon" src="/assets/icons/upload-simple.svg" alt=""><h2>把图片拖到这里</h2><p>支持 PNG、JPG、WebP 等常见格式</p><button type="button" class="glass-button" id="empty-upload">选择图片</button></div>
    <div class="drop-overlay" id="drop-overlay" hidden><img class="icon" src="/assets/icons/upload-simple.svg" alt=""><span>松开以上传素材</span></div>
   </div>
   <div class="job-progress" id="job-progress" hidden><div><span id="progress-text" role="status">准备处理…</span><button type="button" id="cancel-job" class="glass-button">取消任务</button></div><progress id="progress-bar" max="100" aria-label="处理进度"></progress></div>
   <div id="notice" class="notice" role="status" hidden><img class="icon" src="/assets/icons/info.svg" alt=""><span id="notice-text"></span><button id="close-notice" type="button" aria-label="关闭提示"><img class="icon" src="/assets/icons/x.svg" alt=""></button></div>
  </section>
  <aside class="inspector glass" aria-label="增强设置"><div class="inspector-title"><h1>增强设置</h1><button type="button" class="icon-button" id="reset-settings" title="恢复默认设置" aria-label="恢复默认设置"><img class="icon" src="/assets/icons/arrow-clockwise.svg" alt=""></button></div>
   <form id="settings-form">
    <section class="setting-section"><label for="size-preset">输出分辨率</label><select id="size-preset" name="size"><option value="原始尺寸（不放大）">原始</option><option value="720p (1280×720)">720p</option><option value="1080p (1920×1080)">1080p</option><option value="1440p (2560×1440)">2K · 1440p</option><option value="4K (3840×2160)">4K</option></select><p class="helper">保持原图比例，竖图自动适配。</p>
    </section>
    <section class="setting-section"><label>画面风格</label><div class="segmented style-switch"><button type="button" data-style="默认" class="active">默认</button><button type="button" data-style="自然">自然</button><button type="button" data-style="电影">电影</button></div>
     <div class="range-heading"><label for="intensity">增强强度</label><input id="intensity-number" type="number" min="0" max="2" step="0.05" value="1" aria-label="增强强度数值"></div><input id="intensity" name="intensity" type="range" min="0" max="2" step="0.05" value="1"><div class="range-bounds"><span>0</span><span>2</span></div>

    </section>
    <details class="advanced"><summary>高级设置<img class="icon" src="/assets/icons/caret-right.svg" alt=""></summary><div class="detail-content"><div id="advanced-sliders"></div><label class="check-row"><input type="checkbox" name="ui_correction">界面元素修正</label><label class="check-row"><input type="checkbox" name="auto_mask">自动遮罩</label><label class="check-row"><input type="checkbox" name="hdr">HDR 线性色彩</label></div></details>
    <div id="video-settings" hidden>
     <details><summary>运动与时序<img class="icon" src="/assets/icons/caret-right.svg" alt=""></summary><div class="detail-content"><label>运动估计引擎<select name="motion_engine"><option value="auto">自动选择（推荐）</option><option value="nvof">NVIDIA 光流</option><option value="lk">LK 光流</option></select></label><label class="check-row"><input type="checkbox" name="motion" checked>启用运动补偿</label><label class="check-row"><input type="checkbox" name="motion_vis">显示光流（调试）</label></div></details>
     <details open><summary>视频导出<img class="icon" src="/assets/icons/caret-right.svg" alt=""></summary><div class="detail-content"><label>视频编码<select name="codec" id="codec"></select></label><div class="two-fields"><label>文件格式<select name="container" id="container"></select></label><label id="bit-depth-field">位深<select name="bit_depth"><option value="10">10 bit</option><option value="8">8 bit</option></select></label></div><label id="quality-field">输出画质<select id="quality"><option value="15">极高画质（CQ 15）</option><option value="19" selected>高画质（CQ 19）</option><option value="23">均衡（CQ 23）</option><option value="28">节省空间（CQ 28）</option><option value="custom">自定义</option></select></label><div id="custom-quality" class="two-fields" hidden><label>CQ<input type="number" name="cq" value="19" min="0" max="51"></label><label>码率 / kbit/s<input type="number" name="bitrate" value="0" min="0" max="1000000"></label></div><label>音频处理<select name="audio"><option value="auto">自动选择</option><option value="copy">保留原音轨</option><option value="aac">AAC</option><option value="opus">Opus</option><option value="flac">FLAC 无损</option><option value="none">移除音频</option></select></label><label id="enc-preset-field">编码预设<select name="enc_preset"><option>p1</option><option>p2</option><option>p3</option><option>p4</option><option selected>p5</option><option>p6</option><option>p7</option></select></label><label id="prores-field" hidden>ProRes 规格<select name="prores_profile"><option>proxy</option><option>lt</option><option>standard</option><option selected>hq</option><option>4444</option><option>4444xq</option></select></label><p id="codec-note" class="helper" role="status"></p><label>处理帧数（0 为全部）<input name="frames" type="number" min="0" step="1" value="0"></label></div></details>
    </div>
   </form>
  </aside>
  <div class="output-bar glass"><div class="output-info"><img class="icon" src="/assets/icons/download-simple.svg" alt=""><span>输出</span><strong id="output-size">—</strong><button type="button" id="status-button" title="查看处理日志"><span class="status-dot"></span><span id="status-text">等待素材</span></button></div><a class="glass-button download disabled" id="download" aria-disabled="true" tabindex="-1"><img class="icon" src="/assets/icons/download-simple.svg" alt=""><span id="download-label">下载结果</span></a></div>
  <button type="button" id="start-button" class="start-button glass" disabled><img class="icon" src="/assets/icons/play.svg" alt=""><span>开始处理</span></button>
 </main>
</div>
<input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,image/bmp,image/tiff" hidden>
<dialog id="log-dialog"><div class="dialog-heading"><h2>处理日志</h2><button type="button" id="close-log" class="icon-button" aria-label="关闭日志"><img class="icon" src="/assets/icons/x.svg" alt=""></button></div><pre id="job-log">尚未开始处理。</pre></dialog>
<script src="/preview-zoom.js?v=fixes-1" defer></script><script src="/video-player.js?v=fixes-1" defer></script><script src="/studio.js?v=fixes-1" defer></script><script src="/workspace.js?v=fixes-1" defer></script>
<script src="/history.js?v=fixes-1" defer></script>
<script src="/desktop-shell.js?v=maximize-1"></script></body></html>
